# PR titles are Conventional Commits (matches the treadmark and holy-qcow
# repos). Squash-merge turns the title into the commit that later drives
# releases.
name: pr-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
